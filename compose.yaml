services:
  redis:
    image: redis:alpine
    container_name: redis_cache
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    container_name: food_order_api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  worker:
    build: .
    container_name: food_order_worker
    restart: always
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A task worker --loglevel=info --pool=threads --concurrency=4 -n worker1@%h

volumes:
  redis_data:
